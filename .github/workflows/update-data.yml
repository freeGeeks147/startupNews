name: Update data

# Daily: collect new funding articles and extract deals into data/pending/ (feeds only keep
# about a week of items, so this has to run more often than the site publishes).
# Sundays: publish confident deals, then redeploy the site.
# Run it by hand from the Actions tab; tick "publish" to push data live immediately.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN uses your Claude Pro subscription (same token as indiacwg.com;
# create one with `claude setup-token`). An ANTHROPIC_API_KEY secret, if set, is used instead.
# Does nothing until one of the two secrets is set.

on:
  schedule:
    - cron: "30 2 * * *" # 08:00 IST daily
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the website after collecting"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check for API key
        id: key
        run: |
          if [ -z "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ] && [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "::warning::No CLAUDE_CODE_OAUTH_TOKEN secret is set, so no data was collected. Add it under Settings > Secrets and variables > Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.key.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - if: steps.key.outputs.ok == 'true'
        run: pip install -r pipeline/requirements.txt

      - name: Install Claude Code
        if: steps.key.outputs.ok == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Collect and extract deals
        id: collect
        if: steps.key.outputs.ok == 'true'
        timeout-minutes: 30
        run: python -m pipeline.run
        env:
          PYTHONUNBUFFERED: "1"
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Decide whether to publish
        id: when
        if: always() && steps.key.outputs.ok == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%u)" = "7" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"   # Sunday
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish confident deals
        if: always() && steps.when.outputs.publish == 'true'
        run: python -m pipeline.publish
        env:
          PYTHONUNBUFFERED: "1"

      # Runs even if collection stopped part-way, so finished articles aren't redone.
      - name: Commit data
        id: commit
        if: always() && steps.key.outputs.ok == 'true'
        run: |
          git config user.name "deepfund-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: update $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made by this workflow don't trigger other workflows, so start the deploy explicitly.
      - name: Redeploy site
        if: always() && steps.when.outputs.publish == 'true' && steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
