name: Daily ingest

# Polls the funding sources, extracts deals with Claude and commits new rounds to data/pending/
# for review. Does nothing until the ANTHROPIC_API_KEY repository secret is set.

on:
  schedule:
    - cron: "30 2 * * *" # 08:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for API key
        id: key
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "ANTHROPIC_API_KEY secret not set; skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.key.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - if: steps.key.outputs.ok == 'true'
        run: pip install -r pipeline/requirements.txt
      - if: steps.key.outputs.ok == 'true'
        run: python -m pipeline.run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit review queue
        if: steps.key.outputs.ok == 'true'
        run: |
          git config user.name "deepfund-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "ingest: new rounds for review ($(date -u +%F))"
          git push
